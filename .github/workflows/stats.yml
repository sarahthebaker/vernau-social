name: stats
# Daily: pull insights for every post into stats/insights.json (read by the reel maker).
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 publisher/stats.py
      - name: Commit
        run: |
          git config user.name "vernau-social bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          if ! git diff --cached --quiet; then
            git commit -m "stats $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
